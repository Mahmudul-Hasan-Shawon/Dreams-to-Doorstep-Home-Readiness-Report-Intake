<style>
/* Design System based on screenshots */
:root {
  /* EXIT Realty Color Palette */
  --primary-teal: rgb(11, 124, 142);           /* rgb(11, 124, 142) */
  --primary-dark: #000000;                     /* Black */
  --primary-light: #FFFFFF;                    /* White */
  --secondary-dark-teal: #006B73;              /* Darker teal */
  --secondary-light-teal: #00A8B3;             /* Lighter teal */
  --accent-bright: #00D4E0;                    /* Bright teal accent */

  /* Neutral Colors */
  --white: #FFFFFF;
  --light-gray: #F8F9FA;
  --medium-gray: #E9ECEF;
  --dark-gray: #6C757D;
  --text-primary: #212529;
  --text-secondary: #6C757D;

  /* Gradients */
  --gradient-primary: linear-gradient(135deg, var(--primary-teal) 0%, var(--secondary-dark-teal) 100%);
  --gradient-hero: linear-gradient(135deg, var(--primary-teal) 0%, var(--secondary-light-teal) 100%);
  --gradient-accent: linear-gradient(135deg, var(--secondary-light-teal) 0%, var(--primary-teal) 100%);
  --gradient-card: linear-gradient(145deg, #ffffff 0%, #f8f9fa 100%);

  /* Typography */
  --font-primary: 'Lato', 'Lato', sans-serif;
  --font-weight-light: 300;
  --font-weight-normal: 400;
  --font-weight-medium: 500;
  --font-weight-semibold: 600;
  --font-weight-bold: 700;
  --font-weight-extrabold: 800;

  /* Font Sizes */
  --text-xs: 0.75rem;    /* 12px */
  --text-sm: 0.875rem;   /* 14px */
  --text-base: 1rem;     /* 16px */
  --text-lg: 1.125rem;   /* 18px */
  --text-xl: 1.25rem;    /* 20px */
  --text-2xl: 1.5rem;    /* 24px */
  --text-3xl: 1.875rem;  /* 30px */
  --text-4xl: 2.25rem;   /* 36px */
  --text-5xl: 3rem;      /* 48px */

  /* Spacing */
  --space-1: 0.25rem;    /* 4px */
  --space-2: 0.5rem;     /* 8px */
  --space-3: 0.75rem;    /* 12px */
  --space-4: 1rem;       /* 16px */
  --space-5: 1.25rem;    /* 20px */
  --space-6: 1.5rem;     /* 24px */
  --space-8: 2rem;       /* 32px */
  --space-10: 2.5rem;    /* 40px */
  --space-12: 3rem;      /* 48px */
  --space-16: 4rem;      /* 64px */
  --space-20: 5rem;      /* 80px */

  /* Border Radius */
  --radius-sm: 0.25rem;   /* 4px */
  --radius-md: 0.5rem;    /* 8px */
  --radius-lg: 0.75rem;   /* 12px */
  --radius-xl: 1rem;      /* 16px */
  --radius-2xl: 1.5rem;   /* 24px */
  --radius-full: 9999px;

  /* Shadows */
  --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
  --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
  --shadow-2xl: 0 25px 50px -12px rgba(0, 0, 0, 0.25);

  /* Transitions */
  --transition-fast: 150ms ease;
  --transition-base: 250ms ease;
  --transition-slow: 350ms ease;
}

/* Global Styles */
* {
  box-sizing: border-box;
}

body {
  font-family: var(--font-primary);
  font-weight: var(--font-weight-normal);
  line-height: 1.6;
  color: var(--text-primary);
  background: var(--light-gray);
  margin: 0;
  padding: 0;
  background-image: radial-gradient(rgb(11, 124, 142) 11.6%, transparent 11.6%);
    background-position: 4px 4px;
    background-size: 8px 8px;
    background-color: rgb(165 184 196);
}

/* Container */
.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 var(--space-4);
}

/* Typography */
h1, h2, h3, h4, h5, h6 {
  font-weight: var(--font-weight-bold);
  line-height: 1.2;
  margin: 0;
}

h1 {
  font-size: var(--text-4xl);
  font-weight: var(--font-weight-extrabold);
}

h2 {
  font-size: var(--text-3xl);
  font-weight: var(--font-weight-bold);
}

h3 {
  font-size: var(--text-2xl);
  font-weight: var(--font-weight-semibold);
}

h4 {
  font-size: var(--text-xl);
  font-weight: var(--font-weight-semibold);
}

h5 {
  font-size: var(--text-lg);
  font-weight: var(--font-weight-medium);
}

h6 {

  font-weight: var(--font-weight-medium);
}

p {
  margin: 0 0 var(--space-4);
  line-height: 1.6;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  padding: var(--space-3) var(--space-6);
  font-family: var(--font-primary);
  font-size: var(--text-base);
  font-weight: var(--font-weight-medium);
  line-height: 1;
  text-decoration: none;
  border: none;
    cursor: pointer;
  transition: all var(--transition-base);
  user-select: none;
}

.btn:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

/* Button Variants */
.btn-primary {
  background: var(--gradient-primary);
  color: var(--white);
  box-shadow: var(--shadow-md);
}

.btn-primary:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg);
}

.btn-secondary {
  background: var(--white);
  color: var(--primary-teal);
  border: 2px solid var(--primary-teal);
}

.btn-secondary:hover:not(:disabled) {
  background: var(--primary-teal);
  color: var(--white);
  transform: translateY(-2px);
}

.btn-accent {
  background: var(--gradient-accent);
  color: var(--white);
  box-shadow: var(--shadow-md);
}

.btn-accent:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: var(--shadow-lg);
}

.btn-outline {
  background: transparent;
  color: var(--primary-teal);
  border: 2px solid var(--primary-teal);
}

.btn-outline:hover:not(:disabled) {
  background: var(--primary-teal);
  color: var(--white);
}

/* Button Sizes */
.btn-sm {
  padding: var(--space-2) var(--space-4);
  font-size: var(--text-sm);
}

.btn-lg {
  padding: var(--space-4) var(--space-8);
  font-size: var(--text-lg);
}

/* Cards */
.card {
  background: rgba(255, 255, 255, 0.95);
  box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08), 0 1px 4px rgba(0, 0, 0, 0.04);
  border: 1px solid rgba(11, 124, 142, 0.1);
  overflow: hidden;
  transition: all var(--transition-base);
  backdrop-filter: blur(4px);
}

.card:hover {
  transform: translateY(-4px);
  box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15), 0 3px 10px rgba(0, 0, 0, 0.08);
  background: rgba(255, 255, 255, 1);
}

.card-header {
  padding: var(--space-6);
  border-bottom: 1px solid var(--medium-gray);
}

.card-body {
  padding: var(--space-6);
}

.card-footer {
  padding: var(--space-6);
  border-top: 1px solid var(--medium-gray);
  background: var(--light-gray);
}

/* Hero Section */
.hero {
  background: var(--gradient-hero);
  color: var(--white);
  padding: var(--space-16) var(--space-6);
    margin-bottom: var(--space-8);
  position: relative;
  overflow: hidden;
}

.hero::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: url('data:image/svg+xml,<svg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"><g fill="none" fill-rule="evenodd"><g fill="%23ffffff" fill-opacity="0.05"><circle cx="7" cy="7" r="1"/></g></svg>');
  opacity: 0.5;
}

.hero-content {
  position: relative;
  z-index: 1;
  text-align: center;
}

.hero h1 {
  color: var(--white);
  margin-bottom: var(--space-4);
  font-size: var(--text-5xl);
  font-weight: var(--font-weight-extrabold);
}

.hero p {
  color: rgba(255, 255, 255, 0.9);
  font-size: var(--text-lg);
  font-weight: var(--font-weight-medium);
  margin: 0;
}

/* Stats Grid */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: var(--space-6);
  margin-bottom: var(--space-8);
}

.stat-card {
  background: var(--white);
    padding: var(--space-6);
  box-shadow: var(--shadow-md);
  border: 1px solid var(--medium-gray);
  transition: all var(--transition-base);
  position: relative;
  overflow: hidden;
}

.stat-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 4px;
  height: 100%;
  background: var(--gradient-primary);
  transform: scaleY(0);
  transition: transform var(--transition-base);
}

.stat-card:hover {
  transform: translateY(-4px);
  box-shadow: var(--shadow-xl);
}

.stat-card:hover::before {
  transform: scaleY(1);
}

.stat-header {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  margin-bottom: var(--space-4);
}

.stat-icon {
  width: 48px;
  height: 48px;
    display: flex;
  align-items: center;
  justify-content: center;
  background: var(--white);
  color: var(--primary-teal);
  font-size: var(--text-xl);
  border: 2px solid var(--primary-teal);
  box-shadow: var(--shadow-md);
  transition: all var(--transition-base);
}

.stat-icon:hover {
  background: var(--primary-teal);
  color: var(--white);
  border-color: var(--primary-teal);
}

.stat-title {
  font-size: var(--text-lg);
  font-weight: var(--font-weight-semibold);
  color: var(--text-primary);
}

.stat-value {
  font-size: var(--text-3xl);
  font-weight: var(--font-weight-extrabold);
  color: var(--primary-teal);
  margin-bottom: var(--space-2);
}

.stat-change {
  display: inline-block;
  padding: var(--space-1) var(--space-3);
    font-size: var(--text-xs);
  font-weight: var(--font-weight-semibold);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.stat-change.positive {
  background: rgba(76, 175, 80, 0.1);
  color: var(--success-green);
}

.stat-change.negative {
  background: rgba(244, 67, 54, 0.1);
  color: var(--danger-red);
}

/* Section Headers */
.section-header {
  text-align: center;
  margin-bottom: var(--space-8);
}

.section-header h2 {
  color: var(--primary-teal);
  margin-bottom: var(--space-3);
  font-size: var(--text-4xl);
  font-weight: var(--font-weight-extrabold);
}

.section-header p {
  color: var(--text-secondary);
  font-size: var(--text-lg);
  font-weight: var(--font-weight-medium);
  margin: 0;
}

/* Progress Indicators */
.progress {
  width: 100%;
  height: 8px;
  background: var(--medium-gray);
    overflow: hidden;
}

.progress-bar {
  height: 100%;
  background: var(--gradient-primary);
    transition: width var(--transition-slow);
  position: relative;
}

.progress-bar::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
  animation: shimmer 2s infinite;
}

@keyframes shimmer {
  0% { transform: translateX(-100%); }
  100% { transform: translateX(100%); }
}

/* Forms */
.form-group {
  margin-bottom: var(--space-5);
}

.form-label {
  display: block;
  font-size: var(--text-sm);
  font-weight: var(--font-weight-medium);
  color: var(--text-primary);
  margin-bottom: var(--space-2);
}

.form-input {
  width: 100%;
  padding: var(--space-3) var(--space-4);
  font-family: var(--font-primary);
  font-size: var(--text-base);
  border: 2px solid var(--medium-gray);
    transition: all var(--transition-base);
}

.form-input:focus {
  outline: none;
  border-color: var(--primary-teal);
  box-shadow: 0 0 0 3px rgba(11, 124, 142, 0.1);
}

/* Utility Classes */

.text-left { text-align: left; }

.text-success { color: var(--success-green); }
.text-warning { color: var(--warning-orange); }
.text-danger { color: var(--danger-red); }
.text-white { color: var(--white); }

.bg-primary { background: var(--primary-teal); }
.bg-secondary { background: var(--secondary-dark-teal); }
.bg-light { background: var(--light-gray); }
.bg-white { background: var(--white); }

.mb-0 { margin-bottom: 0; }

.mb-3 { margin-bottom: var(--space-3); }

.mt-0 { margin-top: 0; }

/* Responsive Design */
@media (max-width: 768px) {
